name: Publish

# 打 tag 时发布到 PyPI（Trusted Publishing，不需要存 token），
# 并把 sdist/wheel 挂到对应的 GitHub Release 上。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          workhub --version
          python -c "import workhub, pathlib; p = pathlib.Path(workhub.__file__).parent / 'web' / 'index.html'; assert p.is_file(), p"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    # 仓库变量 PYPI_ENABLED=true 时才推 PyPI：PyPI 那边还没认领仓库的话，
    # 打标签不会因此变红，包照样挂在 Release 上。（Settings → Variables 里开）
    if: vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    # PyPI 的 trusted publisher 里填的环境名要和这里一致
    environment:
      name: pypi
      url: https://pypi.org/p/workhub
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # 两条路：仓库里配了 PYPI_API_TOKEN 就用 token（最省事），
      # 没配就走 Trusted Publishing（PyPI 上认过 pending publisher 即可，不需要任何密钥）。
      - name: Publish with API token
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish with Trusted Publishing
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    name: Attach files to the GitHub Release
    needs: build
    # 只有真的推了标签才挂 Release；手动 dispatch 时跳过
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
